name: Finish verified Aureon source publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-source.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reconstruct and verify the complete source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, tarfile, urllib.request
          root = pathlib.Path('.')
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def blob(sha):
              obj = get('/git/blobs/' + sha)
              data = base64.b64decode(obj['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise ValueError('Git blob checksum mismatch')
              return data
          def verified(data, expected):
              if hashlib.sha256(data).hexdigest() != expected:
                  raise ValueError('SHA256 checksum mismatch')
              return data
          def read_archive(payload, prefix=False):
              data = lzma.LZMADecompressor().decompress(payload)
              files = {}
              try:
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as archive:
                      for member in archive:
                          path = pathlib.PurePosixPath(member.name)
                          if (not member.isfile() or path.is_absolute() or '..' in path.parts or not path.parts
                              or path.parts[0] in ('.git', '.github') or str(path) != member.name
                              or member.name in files or member.size > 10000000):
                              raise ValueError('Unsafe archive member: ' + member.name)
                          content = archive.extractfile(member).read()
                          if len(content) != member.size:
                              raise EOFError('Truncated member')
                          files[member.name] = content
              except (tarfile.TarError, EOFError):
                  if not prefix:
                      raise
              return files
          parts = sorted((root / '.github/import-recovery').glob('part*.b64'))
          if len(parts) != 15:
              raise ValueError('Expected 15 original source chunks')
          original = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          verified(original, '0b4e696865818b13131373ee20515018debd4a2e9c0fce3af88326f8807874aa')
          tree = get('/git/trees/224af38b6116fa314afb79dcb3da6b6012203328')['tree']
          if len(tree) != 13 or any(x['type'] != 'blob' for x in tree):
              raise ValueError('Unexpected supplemental tree')
          supplement = base64.b64decode(''.join(blob(x['sha']).decode('ascii').strip() for x in sorted(tree, key=lambda x: x['path'])), validate=True)
          verified(supplement, '3c32c5f1e6ebd5a16fc34cdab1f7eb5b77b4cb2996ec3a60fe7c227e02a1416f')
          tail_shas = ['8499beed2446757d04c4b58d4d5e81a6585c47a5', '5292d75a1b5223f4aa99727deeedef0bced4d793', '919aed5d334b139afec7490acff331996a7aaa4a', '1e418353f37e77a6aa127e8d448b16a40d22b5a8']
          tail = b''.join(blob(sha) for sha in tail_shas)
          verified(tail, 'e1740f653cb1b545a6b6bfc45676e0f324a52a546ce99a5ed5f7b8ccd1acb2a1')
          files = {**read_archive(original, True), **read_archive(supplement, True), **read_archive(tail)}
          manifest = verified(files['MANIFEST.sha256'], '492248b5eddd8fa664231dbe8c32ba8c145c36823164ffa156e13aa03e0aa7d2')
          names = []
          for line in manifest.decode('utf-8').splitlines():
              expected, name = line.split('  ', 1)
              verified(files[name], expected)
              names.append(name)
          if len(names) != 108 or len(set(names)) != 108 or set(files) != set(names) | {'MANIFEST.sha256'}:
              raise ValueError('Incomplete or unexpected source manifest coverage')
          for name, data in files.items():
              target = root / name
              if target.is_symlink() or any(parent.is_symlink() for parent in target.parents):
                  raise ValueError('Refusing to follow a symbolic link')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print('Verified and materialized all 108 source files and their complete SHA256 manifest.')
          PY
      - name: Run CPU, HTTP and Pages packaging tests
        run: npm test
      - name: Verify the public browser asset build
        run: npm run build:pages
      - name: Commit readable source and remove temporary transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import pathlib, subprocess
          paths = [line.split('  ', 1)[1] for line in pathlib.Path('MANIFEST.sha256').read_text().splitlines()]
          subprocess.run(['git', 'add', '-f', '--', *paths, 'MANIFEST.sha256'], check=True)
          PY
          git rm -r -- .github/import-recovery
          git commit -m 'feat: publish Aureon Studio and Aureon Ray v0.2 readable source'
          git push origin HEAD:main
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '108 source files verified; 162 tests passed; 59 browser assets packaged.' >> "$GITHUB_STEP_SUMMARY"
