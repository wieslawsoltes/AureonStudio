name: Inspect staged source transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Recover staged supplement and inventory complete files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, tarfile, urllib.request
          out = pathlib.Path('transfer-inspection'); out.mkdir()
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          tree = get('/git/trees/224af38b6116fa314afb79dcb3da6b6012203328')['tree']
          chunks = []
          for item in sorted(tree, key=lambda x: x['path']):
              blob = get('/git/blobs/' + item['sha'])
              chunks.append(base64.b64decode(blob['content']).decode('ascii').strip())
          payload = base64.b64decode(''.join(chunks), validate=True)
          (out / 'supplement.xz').write_bytes(payload)
          decoder = lzma.LZMADecompressor()
          decoded = decoder.decompress(payload)
          (out / 'supplement.tar').write_bytes(decoded)
          inventory = []
          try:
              archive = tarfile.open(fileobj=io.BytesIO(decoded))
              for member in archive:
                  if not member.isfile():
                      continue
                  data = archive.extractfile(member).read()
                  if len(data) != member.size:
                      break
                  inventory.append({'path': member.name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()})
          except (tarfile.TarError, EOFError) as error:
              print('Incomplete prefix:', error)
          report = {'compressedBytes': len(payload), 'complete': decoder.eof, 'sha256': hashlib.sha256(payload).hexdigest(), 'files': inventory}
          try:
              report['pages'] = get('/pages')
          except Exception as error:
              report['pages_error'] = str(error)
          (out / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-inspection
          path: transfer-inspection/
          retention-days: 3
