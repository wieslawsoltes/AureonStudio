name: Integrate reviewed plaintext source patches
on:
  push:
    branches: [feat/production-systems-v03]
    paths: [.github/workflows/integrate-pending.yml, '.integration/**']
permissions:
  contents: write
  actions: write
concurrency:
  group: aureon-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply readable source patches and verify all recovered files
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          patches = sorted((root / '.integration').glob('*.patch'))
          if not patches:
              raise SystemExit('No source patches supplied')
          for patch in patches:
              for line in patch.read_text().splitlines():
                  if line.startswith(('--- ', '+++ ')):
                      path = pathlib.PurePosixPath(line[4:].split('\t')[0])
                      if path.is_absolute() or '..' in path.parts or len(path.parts) < 3 or path.parts[0] not in ('a', 'b') or path.parts[1] not in ('src', 'tests'):
                          raise SystemExit('Patch outside application/test source: ' + str(path))
          subprocess.run(['git', 'apply', '--check', *map(str, patches)], check=True)
          subprocess.run(['git', 'apply', *map(str, patches)], check=True)
          expected = json.loads((root / '.integration/expected.json').read_text())
          for name, digest in expected.items():
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in ('src', 'tests'):
                  raise SystemExit('Invalid manifest path')
              actual = hashlib.sha256((root / path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'Hash mismatch for {name}: {actual} != {digest}')
          print(f'All {len(expected)} recovered files match the locally tested source.')
          # The recovered common shader has a whitespace-only line. Normalize
          # formatting after proving byte-exact recovery, before running tests.
          shader = root / 'src/render/common.wgsl'
          shader.write_text('\n'.join(line.rstrip() for line in shader.read_text().splitlines()) + '\n')
          PY
      - name: Run CPU and deployment packaging regressions
        run: |
          npm test
          git diff --check
      - name: Commit integrated source on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tests
          git rm -r -- .integration
          git commit -m 'feat: integrate graph-specialized shaders and complete production authoring workspaces'
          git push origin HEAD:feat/production-systems-v03
      - name: Run real WebGPU validation on the committed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webgpu.yml --repo "$GITHUB_REPOSITORY" --ref feat/production-systems-v03
