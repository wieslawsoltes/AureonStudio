name: WebGPU renderer regression
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test tooling
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Execute real WGSL, transport, example scenes and startup failure tests
        run: python3 tests/gpu-regression.py --software
      - name: Exercise the editor, files, animation and production-to-modeling transitions
        run: |
          BROWSER=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python3 tests/browser.py --software --browser "$BROWSER" --output test-results/gpu/editor-regression
      - name: Retain actual GPU execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-regression
          path: test-results/gpu
          if-no-files-found: error
          retention-days: 30
