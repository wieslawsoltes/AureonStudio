name: Optimize and validate packed shader access
on:
  push:
    branches: [feat/production-systems-v03]
    paths: [.github/workflows/repair-compile.yml]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply explicit source-level shader optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          r=Path('.')
          p=r/'src/render/common.wgsl';s=p.read_text()
          assert 'const FIBERS_ENABLED' not in s
          s=s.replace('const PI:f32=', 'const FIBERS_ENABLED:bool=false;\nconst PI:f32=',1)
          old='fn evaluateBSDF(m:Material,color:vec3f,n:vec3f,wo:vec3f,wi:vec3f)->BSDF {\n if(m.pattern.x<0.&&fiberRadius>0.){return evaluateFiber(m,n,wo,wi);}'
          assert old in s
          s=s.replace(old,'''// Fiber dispatch is specialized per scene, not interpreted in every path.
          fn evaluateBSDF(m:Material,color:vec3f,n:vec3f,wo:vec3f,wi:vec3f)->BSDF {
           if(FIBERS_ENABLED&&m.pattern.x<0.&&fiberRadius>0.){return evaluateFiber(m,n,wo,wi);}
           return evaluateSurfaceBSDF(m,color,n,wo,wi);
          }
          fn evaluateSurfaceBSDF(m:Material,color:vec3f,n:vec3f,wo:vec3f,wi:vec3f)->BSDF {''')
          s=s.replace('@group(1) @binding(2) var<storage,read> graphCode:array<GraphInstruction>;', '''// A vec4 view preserves the 64-byte instruction ABI while scalar voxel/tile
          // reads load one vector, without expanding an entire instruction and branching
          // over four possible fields at every trilinear texture tap.
          @group(1) @binding(2) var<storage,read> graphData:array<vec4f>;
          fn graphInstruction(index:u32)->GraphInstruction {
           let p=index*4u;return GraphInstruction(graphData[p],graphData[p+1u],graphData[p+2u],graphData[p+3u]);
          }''')
          s=re.sub(r'fn assetScalar\(offset:u32\)->f32 \{[^\n]+\}', 'fn assetScalar(offset:u32)->f32 {return graphData[offset/4u][offset%4u];}',s)
          s=re.sub(r'graphCode\[([^\[\]]+)\]',r'graphInstruction(\1)',s)
          s=s.replace('if((u32(t.uv2.z)&8u)!=0u)', 'if(FIBERS_ENABLED&&(u32(t.uv2.z)&8u)!=0u)')
          p.write_text(s)
          p=r/'src/render/pathtrace.wgsl';s=p.read_text();s=re.sub(r'graphCode\[([^\[\]]+)\]',r'graphInstruction(\1)',s)
          s=s.replace('if(mat.pattern.x<0.&&fiberRadius>0.)','if(FIBERS_ENABLED&&mat.pattern.x<0.&&fiberRadius>0.)').replace('if(m.pattern.x<0.&&fiberRadius>0.&&','if(FIBERS_ENABLED&&m.pattern.x<0.&&fiberRadius>0.&&')
          # photonGather is only reached for non-fiber materials. Avoid expanding
          # the full cylindrical BSDF into all 27 photon-neighborhood iterations.
          s=s.replace('let bs=evaluateBSDF(m,m.base.rgb,n,wo,record.incoming.xyz);','let bs=evaluateSurfaceBSDF(m,m.base.rgb,n,wo,record.incoming.xyz);')
          s=s.replace('// triangles, material graph interpreter, light CDF and BVH.', '// triangles, specialized material graphs, light CDF and BVH.')
          p.write_text(s)
          p=r/'src/materials/wgsl-graph.js';s=p.read_text();s=re.sub(r'graphCode\[([^\[\]]+)\]',r'graphInstruction(\1)',s)
          s=s.replace('return {source,key:source,instructions:total};','const fibers=materials.some(m=>!!m.fiber);\n return {source,key:`fiber:${fibers}\\n${source}`,fibers,instructions:total};')
          s=s.replace("return {...shader,code:common.slice(0,a)+shader.source+common.slice(end)};", "const code=common.slice(0,a)+shader.source+common.slice(end);return {...shader,code:code.replace('const FIBERS_ENABLED:bool=false;',`const FIBERS_ENABLED:bool=${shader.fibers};`)};")
          p.write_text(s)
          p=r/'tests/graph-codegen.test.mjs';s=p.read_text();s+='''
          test('Fiber specialization is structural and preserves numerical parameter updates',async()=>{const common=await readFile(new URL('../src/render/common.wgsl',import.meta.url),'utf8');const a=specializeMaterialSource(common,[{}]),b=specializeMaterialSource(common,[{fiber:{roughness:.3}}]),c=specializeMaterialSource(common,[{fiber:{roughness:.7}}]);assert.notEqual(a.key,b.key);assert.equal(b.key,c.key);assert.ok(a.code.includes('FIBERS_ENABLED:bool=false;'));assert.ok(b.code.includes('FIBERS_ENABLED:bool=true;'));});
          test('Density and UDIM scalar access uses direct vector addressing with unchanged instruction stride',async()=>{const common=await readFile(new URL('../src/render/common.wgsl',import.meta.url),'utf8');assert.ok(common.includes('return graphData[offset/4u][offset%4u]'));assert.ok(common.includes('let p=index*4u;'));});
          ''';p.write_text(s)
          PY
      - name: Validate the full CPU suite and source formatting
        run: |
          npm test
          git diff --check
      - name: Commit optimized shader source on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/render/common.wgsl src/render/pathtrace.wgsl src/materials/wgsl-graph.js tests/graph-codegen.test.mjs
          git commit -m 'perf(renderer): specialize fiber code and eliminate branching packed scalar loads'
          git push origin HEAD:feat/production-systems-v03
      - name: Execute real GPU and browser regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webgpu.yml --repo "$GITHUB_REPOSITORY" --ref feat/production-systems-v03
