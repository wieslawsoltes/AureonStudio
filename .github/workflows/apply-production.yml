name: Apply verified production systems source
on:
  push:
    branches: [feat/production-systems-v03]
    paths: [.github/workflows/apply-production.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: production-source-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/production-systems-v03
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify all source bytes before applying the delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          root=pathlib.Path('.')
          shas=['eeeb2ea656bdeaca2e3d6a0d39afb180629f9fe5','0d6b4fd8ee164a6f00e5021861121576994468fa','7961ae657354228c70b80173baefa71d9fa37326','35625b915e6a60f0fb321ea7cbee1edea6950156','f86305311f5a84545e1f099367bfe72b4b178d04','05cfb7a7d0d49e0ec7d95318ac36be3195289d90','5cba96852a4c4f74a50549cd67718f8a82f10fe5','3ab98db015d8bec219f7f5f4b019e130d2d07685','253a54aa901a2c61aafd9aa20221399a99984c95']
          chunks=[]
          for sha in shas:
              request=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              data=json.load(urllib.request.urlopen(request,timeout=30))
              chunk=base64.b64decode(''.join(data['content'].split()),validate=True)
              if hashlib.sha1(f'blob {len(chunk)}\0'.encode()+chunk).hexdigest()!=sha: raise SystemExit('Invalid Git blob')
              chunks.append(chunk)
          payload=b''.join(chunks)
          if hashlib.sha256(payload).hexdigest()!='12ce98dc613eea62e0a13599aaf63437ccfe6f4a14c281d966c01235c6d49c08': raise SystemExit('Archive checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:xz') as archive:
              members=archive.getmembers()
              if len(members)!=35 or sum(m.size for m in members)>5000000: raise SystemExit('Invalid delta size')
              files={}
              for member in members:
                  p=pathlib.PurePosixPath(member.name)
                  if not member.isfile() or p.is_absolute() or '..' in p.parts or p.parts[0] in ('.git','.github') or member.name in files: raise SystemExit('Unsafe path')
                  files[member.name]=archive.extractfile(member).read()
          manifest=json.loads(files.pop('DELTA.json'))
          if {m['path'] for m in manifest}!=set(files) or len(manifest)!=len(files): raise SystemExit('Manifest coverage mismatch')
          for m in manifest:
              path=root/m['path']
              before=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if before!=m['before']: raise SystemExit('Source changed: '+m['path'])
              if hashlib.sha256(files[m['path']]).hexdigest()!=m['after']: raise SystemExit('Changed bytes mismatch: '+m['path'])
          for name,data in files.items():
              path=root/name; path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data)
          pathlib.Path('/tmp/aureon-changed.json').write_text(json.dumps(sorted(files)))
          print('Verified and applied',len(files),'source files')
          PY
      - name: Run CPU and packaging tests
        run: |
          npm test
          git diff --check
      - name: Commit editable source to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/aureon-changed.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git commit -m 'feat: implement exact solids, scene dynamics, UDIM, volumetric transport and durable output'
          git push origin HEAD:feat/production-systems-v03
      - name: Execute actual GPU and editor regressions on the new source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webgpu.yml --ref feat/production-systems-v03
