name: Apply v0.2 source repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-v02.yml']
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Repair the source expression (not a runtime substitution)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/render/pathtrace.wgsl')
          old = 'fn photonHash(c:vec3i)->u32{return (u32(c.x)*73856093u^u32(c.y)*19349663u^u32(c.z)*83492791u)&4095u;}'
          new = '''// WGSL requires explicit grouping between multiplication and bitwise XOR.
          fn photonHash(c:vec3i)->u32 {
           let x=u32(c.x)*73856093u;
           let y=u32(c.y)*19349663u;
           let z=u32(c.z)*83492791u;
           return (x ^ y ^ z) & 4095u;
          }'''
          source = path.read_text()
          if source.count(old) != 1: raise SystemExit('Source changed; refusing an ambiguous repair')
          path.write_text(source.replace(old,new))
          PY
          npm test
          git diff --check
      - name: Commit the repaired shader directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render/pathtrace.wgsl
          git commit -m 'fix(renderer): parenthesize photon spatial hash for valid WGSL'
          git push origin HEAD:main
      - name: Execute GPU regression on the committed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webgpu.yml --ref main
