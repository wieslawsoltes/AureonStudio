name: Apply v0.2 source repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-v02.yml']
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply source-checked diagnostics and rendering-state repairs
        run: |
          python3 scripts/repair-v02.py
          npm test
          git diff --check
      - name: Commit verified source changes directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/render/renderer.js src/render/denoiser.js tests/browser.py tests/production-gpu.html package.json MANIFEST.sha256
          git commit -m 'fix(renderer): diagnose startup correctly and restore editing after production renders'
          git push origin HEAD:main
      - name: Run the GPU-gated Pages deployment on the committed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
