name: Recover interrupted source transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/import-recovery/**'
      - '.github/workflows/recover-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect previously uploaded source data
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, tarfile
          parts = sorted(pathlib.Path('.github/import-recovery').glob('part*.b64'))
          data = base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts), validate=True)
          pathlib.Path('source-recovery.xz').write_bytes(data)
          decoder = lzma.LZMADecompressor()
          raw = decoder.decompress(data)
          pathlib.Path('source-recovery.tar').write_bytes(raw)
          report = {'parts': len(parts), 'compressedBytes': len(data), 'decompressedBytes': len(raw), 'complete': decoder.eof, 'sha256': hashlib.sha256(data).hexdigest(), 'files': []}
          try:
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
                  for member in archive:
                      if member.isfile() and member.offset_data + member.size <= len(raw):
                          content = raw[member.offset_data:member.offset_data+member.size]
                          report['files'].append({'path': member.name, 'size': member.size, 'sha256': hashlib.sha256(content).hexdigest()})
          except tarfile.ReadError:
              pass
          pathlib.Path('source-recovery.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source-data
          path: source-recovery.*
          retention-days: 3
