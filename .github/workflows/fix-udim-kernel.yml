name: Finalize bounded UDIM sampling kernel
on:
  push:
    branches: [feat/production-systems-v03]
    paths: [.github/workflows/fix-udim-kernel.yml]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve trilinear UDIM filtering without an expanded eight-way call tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/render/common.wgsl');s=p.read_text();start=s.index('fn sampleBitmap(');end=s.index('// Graph DAGs',start)
          s=s[:start]+'''fn sampleBitmap(index:u32,uv:vec2f,lod:f32)->vec4f {
           if(index>=u32(cam.assets.y)){return vec4f(1.);}
           let desc=graphInstruction(u32(cam.assets.x)+index);
           if(desc.op.x==0.){return textureSampleLevel(bitmapArray,bitmapSampler,uv,i32(desc.op.y),lod);}
           let last=i32(textureNumLevels(bitmapArray))-1;
           let level=clamp(lod,0.,f32(last));let lo=i32(floor(level));let fraction=fract(level);
           var result=vec4f(0.);
           // A descriptor-bounded loop shares one texture-load path across the
           // eight trilinear taps. The host writes exactly eight taps for UDIM.
           // This avoids exponential driver inlining at multiple shading sites.
           for(var tap=0u;tap<min(8u,u32(desc.extra.x));tap++){
            let upper=tap>=4u;let mip=min(lo+select(0,1,upper),last);
            let p=uv*vec2f(textureDimensions(bitmapArray,mip))-.5;
            let f=fract(p);let offset=vec2i(i32(tap&1u),i32((tap>>1u)&1u));
            let w=select(1.-f,f,offset==vec2i(1));
            let weight=w.x*w.y*select(1.-fraction,fraction,upper);
            result+=udimTexel(desc,vec2i(floor(p))+offset,mip)*weight;
           }
           return result;
          }
          '''+s[end:];p.write_text(s)
          p=Path('src/render/assets.js');s=p.read_text();old='actualTextureRecords[record]=d.kind;';assert old in s;s=s.replace(old,old+'actualTextureRecords[record+12]=d.kind?8:0;',1);p.write_text(s)
          p=Path('tests/volumes-assets.test.mjs');s=p.read_text();s+='''
          test('UDIM host descriptors request all eight cross-tile trilinear taps',()=>{const d=emptyDocument();d.textures=[createPaintTexture({size:2,udim:true})];const a=compileSceneAssets(d);assert.equal(a.data[a.textureOffset*16+12],8);});
          ''';p.write_text(s)
          PY
      - name: Run CPU regression tests and source checks
        run: |
          npm test
          git diff --check
      - name: Commit the verified kernel implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render/common.wgsl src/render/assets.js tests/volumes-assets.test.mjs
          git commit -m 'perf(renderer): flatten UDIM trilinear filtering into a descriptor-bounded kernel'
          git push origin HEAD:feat/production-systems-v03
      - name: Run the complete GPU and editor matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webgpu.yml --repo "$GITHUB_REPOSITORY" --ref feat/production-systems-v03
