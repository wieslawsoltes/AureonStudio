<!doctype html><html lang="en"><meta charset="utf-8"><title>Aureon production systems GPU tests</title><canvas width="128" height="96"></canvas><pre id="log"></pre><script type="module">
import {Renderer} from '../src/render/renderer.js';
import {renderProduction} from '../src/render/production.js';
import {emptyDocument,newObject} from '../src/scene/document.js';
import {compileShaderModule} from '../src/render/diagnostics.js';
import {specializeMaterialSource} from '../src/materials/wgsl-graph.js';
import {checkerGraph,evaluateGraph} from '../src/materials/graph.js';
import {sampleTexture} from '../src/materials/textures.js';
import {evaluateFiber} from '../src/materials/fiber.js';
import {curvesToMesh} from '../src/simulation/curves.js';
import {proceduralDensity} from '../src/volumes/grid.js';
const report=window.report={checks:[],errors:[],status:'running'},log=document.querySelector('#log');
const check=(name,condition=true,details)=>{if(!condition)throw Error(name);report.checks.push({name,passed:true,details});log.textContent=JSON.stringify(report,null,2);};
const finite=a=>a.every(Number.isFinite),energy=a=>a.reduce((s,x,i)=>s+(i%4===3?0:x),0);let r;
async function probe(doc,code,count=16){const d=r.device,common=specializeMaterialSource(r.commonSource,doc.materials).code,output=d.createBuffer({size:count*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),read=d.createBuffer({size:count*4,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});try{
 const module=await compileShaderModule(d,'test-probe.wgsl',`@group(2) @binding(0) var<storage,read_write> output:array<f32>; @compute @workgroup_size(1) fn probe(){${code}}`,common),pipeline=await d.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'probe'}});
 const g0=d.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:r.uniform}},{binding:2,resource:{buffer:r.buffers.materials}}]}),g1=d.createBindGroup({layout:pipeline.getBindGroupLayout(1),entries:[{binding:0,resource:r.textureArray.sampler},{binding:1,resource:r.textureArray.view},{binding:2,resource:{buffer:r.graphBuffer}}]}),g2=d.createBindGroup({layout:pipeline.getBindGroupLayout(2),entries:[{binding:0,resource:{buffer:output}}]});
 const e=d.createCommandEncoder(),p=e.beginComputePass();p.setPipeline(pipeline);p.setBindGroup(0,g0);p.setBindGroup(1,g1);p.setBindGroup(2,g2);p.dispatchWorkgroups(1);p.end();e.copyBufferToBuffer(output,0,read,0,count*4);d.queue.submit([e.finish()]);await read.mapAsync(GPUMapMode.READ);const a=new Float32Array(read.getMappedRange()).slice();read.unmap();return a;
 }finally{read.destroy();output.destroy();}}
function materialProbe(index=0,uv=[.31,.42]){return `let m=surfaceMaterial(${index}u,vec3f(.1,.2,.3),vec2f(${uv.join(',')}));output[0]=m.base.x;output[1]=m.base.y;output[2]=m.base.z;output[3]=m.base.w;output[4]=m.params.x;output[5]=m.params.y;output[6]=m.params.z;output[7]=m.params.w;output[8]=m.reserved.w;output[9]=m.reserved.y;`;}
try{
 r=await new Renderer(document.querySelector('canvas'),(m,type)=>{if(type==='error')report.errors.push(m);}).init();r.device.addEventListener('uncapturederror',e=>report.errors.push(e.error.message));check('Complete fiber/grid/graph-capable pipelines initialize');
 let doc=emptyDocument();doc.settings.seed=41;doc.settings.textureResolution=64;doc.materials[0].graph=checkerGraph();let frame=await renderProduction(r,doc,{width:16,height:12,samples:2});
 let values=await probe(doc,materialProbe()),reference=evaluateGraph(doc.materials[0].graph,{uv:[.31,.42],position:[.1,.2,.3]});check('Specialized graph output matches CPU evaluation',values.slice(0,3).every((x,k)=>Math.abs(x-reference.baseColor[k])<1e-5)&&Math.abs(values[3]-reference.roughness)<1e-5,{values:[...values.slice(0,4)]});
 const pipeline=r.compute;if(!pipeline)throw Error('Missing compute pipeline');doc.materials[0].graph.nodes.find(n=>n.id==='warm').value=[.8,.1,.2,1];await renderProduction(r,doc,{width:16,height:12,samples:1});values=await probe(doc,materialProbe());reference=evaluateGraph(doc.materials[0].graph,{uv:[.31,.42]});check('Editing constants updates values without recompiling pipelines',r.compute===pipeline&&values.slice(0,3).every((x,k)=>Math.abs(x-reference.baseColor[k])<1e-5));
 const graph={nodes:[{id:'uv',type:'uv'},{id:'pos',type:'position'},{id:'c',type:'constant',value:[.2,.4,.6,1]},{id:'two',type:'constant',value:2},{id:'a',type:'add',inputs:{a:'uv',b:'c'}},{id:'s',type:'subtract',inputs:{a:'a',b:'pos'}},{id:'m',type:'multiply',inputs:{a:'s',b:'two'}},{id:'d',type:'divide',inputs:{a:'m',b:'two'}},{id:'sine',type:'sine',inputs:{value:'d'}},{id:'power',type:'power',inputs:{a:'sine',b:'two'}},{id:'ch',type:'channel',inputs:{value:'c'},channel:1},{id:'mix',type:'mix',inputs:{a:'power',b:'c',factor:'ch'}},{id:'ramp',type:'ramp',inputs:{value:'ch',a:'mix',b:'c'}},{id:'clamp',type:'clamp',inputs:{value:'ramp'},value:[0,1]},{id:'noise',type:'noise',inputs:{vector:'pos'},scale:2},{id:'check',type:'checker',inputs:{uv:'uv',a:'clamp',b:'mix'},scale:3}],outputs:{baseColor:'check',roughness:'ch',metallic:'ch',emission:'ch',transmission:'ch',ior:'two',subsurface:'ch',density:'noise'}};
 doc.materials[0].graph=graph;await renderProduction(r,doc,{width:16,height:12,samples:1});values=await probe(doc,materialProbe());reference=evaluateGraph(graph,{uv:[.31,.42],position:[.1,.2,.3]});check('Arithmetic, component, mix, ramp, procedural and surface DAG outputs execute',finite(values)&&values.slice(0,3).every((x,k)=>Math.abs(x-reference.baseColor[k])<2e-5)&&Math.abs(values[3]-.4)<1e-5&&Math.abs(values[6]-2)<1e-5);
 const tile=(c)=>({width:2,height:2,colorSpace:'linear',data:Array.from({length:16},(_,i)=>c[i%4])});doc=emptyDocument();doc.settings.textureResolution=64;doc.settings.textureLod=0;doc.textures=[{kind:'udim',name:'Two tiles',tiles:{1001:tile([255,0,0,255]),1002:tile([0,0,255,255])},missing:[.2,.4,.6,1]}];doc.materials[0].color='#ffffff';doc.materials[0].graph={nodes:[{id:'uv',type:'uv'},{id:'image',type:'image',texture:0,inputs:{uv:'uv'}}],outputs:{baseColor:'image'}};
 await renderProduction(r,doc,{width:16,height:12,samples:1});for(const [uv,expected] of [[[.5,.5],[1,0,0]],[[1.5,.5],[0,0,1]],[[1,.5],[.5,0,.5]],[[2.5,.5],[.2,.4,.6]]]){values=await probe(doc,materialProbe(0,uv));check('UDIM GPU lookup and boundary filter '+uv,values.slice(0,3).every((x,k)=>Math.abs(x-expected[k])<.004),[...values.slice(0,3)]);}
 doc=emptyDocument();doc.materials[0].fiber={roughness:.4,azimuthalRoughness:.4,tilt:2,absorption:[.5,1,2],ior:1.55};const wo=[.2,Math.sqrt(.96),0],wi=[-.3,.4,Math.sqrt(.75)],toWorld=a=>[a[2],a[0],a[1]];
 await renderProduction(r,doc,{width:16,height:12,samples:1});const code=materialProbe()+`fiberTangent=vec3f(0.,1.,0.);fiberNormal=vec3f(0.,0.,1.);fiberRadius=.02;let bs=evaluateFiber(m,vec3f(0.,0.,1.),vec3f(${toWorld(wo).join(',')}),vec3f(${toWorld(wi).join(',')}));output[10]=bs.f.x;output[11]=bs.f.y;output[12]=bs.f.z;output[13]=bs.pdf;`;values=await probe(doc,code);const cpu=evaluateFiber(doc.materials[0].fiber,wo,wi,0);check('WGSL cylindrical fiber PDF and spectral lobes match the CPU reference',Math.abs(values[13]-cpu.pdf)<.003&&[0,1,2].every(k=>Math.abs(values[10+k]*Math.abs(wi[1])-cpu.value[k])<.003),{gpu:[...values.slice(10,14)],cpu});
 const hair=newObject('mesh',{},'Fiber strands');hair.mesh=curvesToMesh([{points:[[-.5,0,0],[0,1.5,0],[.5,2,0]],radius:.06},{points:[[.5,0,0],[.3,1.5,.2],[.6,2,.1]],radius:.06}]);hair.position=[0,0,0];doc.objects.push(hair);frame=await renderProduction(r,doc,{width:32,height:24,samples:8});check('Fiber path tracing produces finite nonzero radiance',finite(frame.hdr.data)&&energy(frame.hdr.data)>0);
 doc=emptyDocument();doc.volumes=[{name:'Grid fog',min:[-1,0,-1],max:[1,2,1],density:.3,color:[.7,.8,1],anisotropy:.2,grid:proceduralDensity({dimensions:[8,8,8],seed:2})},{name:'Clear core',min:[-.2,.4,-.2],max:[.2,1.6,.2],density:0,color:[1,1,1],priority:10,replace:true}];frame=await renderProduction(r,doc,{width:24,height:16,samples:4});check('Sparse heterogeneous density with an empty priority replacement renders',finite(frame.hdr.data)&&finite(frame.aovs.data)&&energy(frame.hdr.data)>0);
 await r.device.queue.onSubmittedWorkDone();check('Advanced rendering reports zero uncaptured GPU errors',report.errors.length===0,report.errors);report.status='passed';
}catch(e){report.failure=e.stack||e.message;report.status='failed';console.error(e);}finally{window.done=true;log.textContent=JSON.stringify(report,null,2);}
</script></html>
